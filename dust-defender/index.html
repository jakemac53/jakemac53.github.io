<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/dust-defender/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A tower defense game where household appliances fight off invading messes.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dust Defender">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dust Defender</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #101820;
      background-image: radial-gradient(circle at 50% 45%, #18222D 0%, #101820 100%);
      color: #FFF5E1;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
      z-index: 0;
    }
    .splash-spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid rgba(143, 211, 244, 0.2);
      border-top-color: #FFCF3A;
      border-right-color: #3F7FBF;
      animation: dust-spin 0.9s linear infinite;
    }
    .splash-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #FFF5E1;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }
    @keyframes dust-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash" aria-hidden="true">
    <div class="splash-spinner"></div>
    <div class="splash-title">Dust Defender</div>
  </div>
  <script src="flutter_bootstrap.js?v=271b6844654c" async></script>
</body>
</html>
